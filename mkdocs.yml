site_name: CCP-NC Magres Database
site_description: User documentation for the CCP-NC Magres Database (NOMAD Oasis)
site_url: https://ccp-nc.github.io/ccpnc-database-documentation/
repo_url: https://github.com/CCP-NC/ccpnc-database-documentation
repo_name: CCP-NC/ccpnc-database-documentation
edit_uri: edit/main/docs/

extra_css:
  - assets/stylesheets/extra.css

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Searching the Database: user-guide/search.md
      - Viewing Results: user-guide/results.md
      - Uploading Data: user-guide/upload.md
      - Datasets: user-guide/datasets.md
  - FAQ: reference/faq.md
  - Support: reference/support.md
